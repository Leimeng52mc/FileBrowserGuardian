name: Windows CI & Release

on:
  push:
    branches: ["main"]
    tags: ['v*']
  pull_request:

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Download modules
        run: go mod download

      - name: Build (windows/amd64)
        run: |
          mkdir -p dist
          go build -ldflags "-s -w" -o dist/FileBrowserGuardian_windows_amd64.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/FileBrowserGuardian_windows_amd64.exe

  release:
    name: Release on tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    needs: build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Download modules
        run: go mod download

      - name: Build release executable
        run: |
          mkdir -p dist
          go build -ldflags "-s -w" -o dist/FileBrowserGuardian_windows_amd64.exe .

      - name: Create checksum
        run: |
          powershell -Command "Get-FileHash -Algorithm SHA256 .\dist\FileBrowserGuardian_windows_amd64.exe | ForEach-Object { \"$($_.Hash)  FileBrowserGuardian_windows_amd64.exe\" } > .\dist\SHA256SUMS"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: Initial release

      - name: Upload exe
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/FileBrowserGuardian_windows_amd64.exe
          asset_name: FileBrowserGuardian_windows_amd64.exe
          asset_content_type: application/octet-stream

      - name: Upload checksum
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/SHA256SUMS
          asset_name: SHA256SUMS
          asset_content_type: text/plain
