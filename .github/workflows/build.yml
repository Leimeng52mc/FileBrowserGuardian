name: CI and Release

on:
  push:
    branches: ["main"]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: Matrix build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [windows, linux, darwin]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/.mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Download modules
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -e
          mkdir -p dist
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; else ext=""; fi
          out=dist/FileBrowserGuardian_${GOOS}_${GOARCH}${ext}
          echo "Building $out"
          GOOS=${GOOS} GOARCH=${GOARCH} go build -ldflags "-s -w" -o "$out" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/FileBrowserGuardian_${{ matrix.os }}_${{ matrix.arch }}*

  release:
    name: Build & Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Download modules
        run: go mod download

      - name: Build all targets
        run: |
          set -e
          mkdir -p dist
          targets=("windows/amd64" "linux/amd64" "darwin/arm64")
          for t in "${targets[@]}"; do
            IFS="/" read -r os arch <<< "$t"
            if [ "$os" = "windows" ]; then ext=".exe"; else ext=""; fi
            out=dist/FileBrowserGuardian_${os}_${arch}${ext}
            echo "Building $out"
            GOOS=${os} GOARCH=${arch} go build -ldflags "-s -w" -o "$out" .
          done

      - name: Create checksums
        run: |
          set -e
          cd dist
          sha256sum * > SHA256SUMS
          cd -

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: Initial release

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/FileBrowserGuardian_windows_amd64.exe
          asset_name: FileBrowserGuardian_windows_amd64.exe
          asset_content_type: application/octet-stream

      - name: Upload linux asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/FileBrowserGuardian_linux_amd64
          asset_name: FileBrowserGuardian_linux_amd64
          asset_content_type: application/octet-stream

      - name: Upload mac asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/FileBrowserGuardian_darwin_arm64
          asset_name: FileBrowserGuardian_darwin_arm64
          asset_content_type: application/octet-stream

      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/SHA256SUMS
          asset_name: SHA256SUMS
          asset_content_type: text/plain
