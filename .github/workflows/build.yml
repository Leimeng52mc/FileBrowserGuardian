name: Windows CI & Release

on:
  push:
    branches: ["main"]
    tags: ['v*']
  pull_request:

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Download modules
        run: go mod download

      - name: Build (windows/amd64)
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -X main.version=dev-${{ github.sha }}" -o dist/FileBrowserGuardian_windows_amd64.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/FileBrowserGuardian_windows_amd64.exe

  release:
    name: Release on tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    needs: build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Download modules
        run: go mod download

      - name: Build release executable
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/FileBrowserGuardian_windows_amd64.exe .

      - name: Create checksum
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 .\dist\FileBrowserGuardian_windows_amd64.exe | ForEach-Object { "$($_.Hash)  FileBrowserGuardian_windows_amd64.exe" } | Out-File .\dist\SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FileBrowserGuardian_windows_amd64.exe
            dist/SHA256SUMS
